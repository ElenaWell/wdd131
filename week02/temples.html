
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A collection of beautiful temples of The Church of Jesus Christ of Latter-day Saints around the world.">
    <meta name="author" content="Elena Well Diaz">
    <title>Temple Album | Sacred Spaces</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->

<body>
    <header>
        <h1>Temple Album</h1>

        <button
            id="menu-button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="primary-navigation">
            ☰
        </button>

        <nav id="primary-navigation">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>

        </nav>

    <main>
        <h2>Sacred Spaces</h2>
        <p>A visual collection of temples around the world.</p>

        <div class="temple-gallery">
            <figure>
                <img src="images/accra-temple.jpeg" alt="Accra Ghana Temple exterior">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/auckland-temple.jpeg" alt="Auckland New Zealand Temple">
                <figcaption>Auckland New Zealand Temple</figcaption>

            <figure>
                <img src="images/bern-temple.jpeg" alt="Bern Switzerland Temple">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>

            <figure>
                <img src="images/davao-temple.jpeg" alt="Davao Philippines Temple">
                <figcaption>Davao Philippines Temple</figcaption>
            </figure>

            <figure>
                <img src="images/washington-temple.jpeg" alt="Washington D.C. Temple">
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>

            <figure>
                <img src="images/paris-temple.jpeg" alt="Paris France Temple">
                <figcaption>Paris France Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rome-temple.jpeg" alt="Rome Italy Temple">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="images/seoul-temple.jpeg" alt="Seoul Korea Temple">
                <figcaption>Seoul Korea Temple</figcaption>
            </figure>

            <figure>
                <img src="images/tokyo-temple.jpeg" alt="Tokyo Japan Temple">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
