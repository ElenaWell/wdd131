<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share your experience with a product by submitting a review.">
    <meta name="author" content="Elena Well Diaz">

    <title>Product Review | Elena Well Diaz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <fieldset>

                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating-options">
                    <div>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating2" name="rating" value="2">
                        <label for="rating2">☆☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating3" name="rating" value="3">
                        <label for="rating3">☆☆☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating4" name="rating" value="4">
                        <label for="rating4">☆☆☆☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating5" name="rating" value="5">
                        <label for="rating5">☆☆☆☆☆</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>


                <label for="installationDate">Date of Installation</label>
                <input type="date" id="installationDate" name="installationDate" required>
            </fieldset>

            <fieldset class="features-fieldset">
                <legend>Select all the features you found useful.</legend>

                <div class="feature-option">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    <label for="durability">Durability</label>
                </div>

                <div class="feature-option">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    <label for="easeOfUse">Ease of Use</label>
                </div>

                <div class="feature-option">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    <label for="performance">Performance</label>
                </div>

                <div class="feature-option">
                    <input type="checkbox" id="design" name="features" value="Design">
                    <label for="design">Design</label>
                </div>
            </fieldset>

            <fieldset>

                <label for="writtenReview">Written Review <span>(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

                <label for="userName">Your Name <span>(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </fieldset>

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Elena Well Diaz | WDD 131</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
